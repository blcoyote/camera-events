services:
    camera-events:
        image: ghcr.io/blcoyote/camera-events:latest
        restart: unless-stopped
        pull_policy: always
        volumes:
            - camera_events_logs:/app/logs/
        networks:
            - datastorage
            - web
        ports:
            - 8008:80
        environment:
            - MAX_WORKERS=1
            - UVICORN_APP_VERSION=0.2.0
            - UVICORN_FRIGATE_BASEURL=$UVICORN_FRIGATE_BASEURL
            - UVICORN_DOCS_URL=$UVICORN_DOCS_URL
            - UVICORN_FIREBASE_CREDENTIALS=$UVICORN_FIREBASE_CREDENTIALS
            - UVICORN_FIREBASE_APIKEY=$UVICORN_FIREBASE_APIKEY
            - UVICORN_AUTHDOMAIN=$UVICORN_AUTHDOMAIN
            - UVICORN_PROJECTID=$UVICORN_PROJECTID
            - UVICORN_STORAGEBUCKET=$UVICORN_STORAGEBUCKET
            - UVICORN_MESSAGESENDERID=$UVICORN_MESSAGESENDERID
            - UVICORN_REDIS_URL=camera-events-redis
            - UVICORN_REDIS_PASSWORD=$REDIS_PASSWORD
            - MINIO_ENDPOINT=camera-events-minio:9000
            - MINIO_ROOT_USER=$MINIO_ROOT_USER
            - MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD
            - MINIO_BUCKET=camera-events
            - UVICORN_APPID=$UVICORN_APPID
            - UVICORN_MEASUREMENTID=$UVICORN_MEASUREMENTID
            - UVICORN_MESSAGINGKEY=$UVICORN_MESSAGINGKEY
            - UVICORN_BASEURL=$UVICORN_BASEURL
        labels:
            - traefik.http.routers.cameraevents.rule=Host(`$DNS_NAME`)
            - traefik.http.routers.cameraevents.tls=true
            - traefik.http.routers.cameraevents.tls.certresolver=lets-encrypt
            - traefik.http.services.cameraevents.loadbalancer.server.port=80
    camera-events-minio:
        image: minio/minio:latest
        container_name: camera-events-minio
        restart: unless-stopped
        networks:
            - datastorage
        volumes:
            - camera_events_minio:/data
        environment:
            - MINIO_ROOT_USER=$MINIO_ROOT_USER
            - MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD
            - MINIO_PROMETHEUS_AUTH_TYPE=public
        command: server /data --console-address ":9001"
    camera-events-redis:
        image: redis:latest
        container_name: camera-events-redis
        restart: unless-stopped
        ports:
            - 6379:6379
        networks:
            - datastorage
        volumes:
            - camera_events_redis:/root/redis
        environment:
            - REDIS_PASSWORD=$REDIS_PASSWORD
            - REDIS_PORT=6379
            - REDIS_DATABASES=1
        command:
            - /bin/sh
            - -c
            - redis-server --requirepass $${REDIS_PASSWORD:?REDIS_PASSWORD variable is not set} --replicaof no one --maxmemory-policy noeviction
        mem_limit: 1g
    camera-events-redis-exporter:
        image: oliver006/redis_exporter:latest
        container_name: camera-events-redis-exporter
        restart: unless-stopped
        networks:
            - datastorage
        environment:
            - REDIS_ADDR=redis://camera-events-redis:6379
            - REDIS_PASSWORD=$REDIS_PASSWORD
        depends_on:
            - camera-events-redis
    camera-events-prometheus:
        image: prom/prometheus:latest
        container_name: camera-events-prometheus
        restart: unless-stopped
        networks:
            - datastorage
        volumes:
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=30d'
        depends_on:
            - camera-events
            - camera-events-redis-exporter
            - camera-events-minio
    camera-events-grafana:
        image: grafana/grafana:latest
        container_name: camera-events-grafana
        restart: unless-stopped
        ports:
            - 3000:3000
        networks:
            - datastorage
        volumes:
            - grafana_data:/var/lib/grafana
            - ./grafana/provisioning:/etc/grafana/provisioning:ro
        environment:
            - GF_SECURITY_ADMIN_USER=$GRAFANA_ADMIN_USER
            - GF_SECURITY_ADMIN_PASSWORD=$GRAFANA_ADMIN_PASSWORD
            - GF_USERS_ALLOW_SIGN_UP=false
        depends_on:
            - camera-events-prometheus
networks:
    web:
        name: web
        external: true
    datastorage:
        name: datastorage
        external: true
volumes:
    camera_events_redis:
        name: camera_events_redis
        driver: local
    camera_events_fcmstore:
        name: camera_events_fcmstore
        driver: local
    camera_events_minio:
        name: camera_events_minio
        driver: local
    camera_events_logs:
        name: camera_events_logs
        driver: local
    prometheus_data:
        name: camera_events_prometheus
        driver: local
    grafana_data:
        name: camera_events_grafana
        driver: local
