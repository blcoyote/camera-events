[pytest]
# Run tests from the api/ directory so imports resolve without a src layout.
testpaths = tests
# Add api/ itself to sys.path so top-level packages (models, tasks, etc.) resolve.
pythonpath = .

# Treat all async test functions as coroutines automatically.
asyncio_mode = auto

# Show short traceback by default; use -v for verbose output.
addopts = --tb=short -q

# Mark definitions — avoids "unknown mark" warnings.
markers =
    unit: fast, no I/O, no containers
    integration: requires testcontainers (Redis, MinIO)
